<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interactive Image Gallery</title>
<style>
:root{--bg:#f6f7fb;--fg:#1d2433;--card:#fff;--accent:#3b4cca;--ring:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151f;--fg:#eef1f8;--card:#1c2132;--accent:#9fb0ff;--ring:#fbbf24}}
:root[data-theme="dark"]{--bg:#12151f;--fg:#eef1f8;--card:#1c2132;--accent:#9fb0ff;--ring:#fbbf24}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:1.5rem 1rem 2.5rem}
h1{margin:0 0 .25rem}
#image{display:flex;align-items:flex-end;justify-content:center;min-height:300px;margin:1rem 0 1.5rem;border-radius:12px;background:var(--card) center/cover no-repeat;border:2px solid var(--accent);overflow:hidden}
#image p{margin:0;width:100%;padding:.75rem 1rem;background:rgba(0,0,0,.75);color:#fff;text-align:center;font-weight:600}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem}
.thumb{width:100%;height:auto;border-radius:8px;border:3px solid transparent;cursor:pointer;background:var(--card)}
.thumb:hover,.thumb:focus{border-color:var(--ring);outline:3px solid var(--ring);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Interactive Image Gallery</h1>
  <p>Hover over a picture, or press Tab to focus it, to see it enlarged below.</p>
  <div id="image" aria-live="polite"><p id="caption">Hover over or tab to an image below to display it here.</p></div>

  </div>
</main>
<script>
var DEFAULT_TEXT = "Hover over or tab to an image below to display it here.";
function upDate(previewPic) {
  console.log("upDate fired. Alt text: " + previewPic.alt);
  var box = document.getElementById("image");
  box.style.backgroundImage = "url('" + previewPic.src + "')";
  document.getElementById("caption").textContent = previewPic.alt;
}
function unDo() {
  console.log("unDo fired.");
  var box = document.getElementById("image");
  box.style.backgroundImage = "";
  document.getElementById("caption").textContent = DEFAULT_TEXT;
}
function addTabFocus() {
  console.log("onload fired: addTabFocus is running.");
  var images = document.getElementsByClassName("thumb");
  for (var i = 0; i < images.length; i++) {
    images[i].setAttribute("tabindex", "0");
  }
}
window.onload = addTabFocus;
</script>
</body>
</html>
